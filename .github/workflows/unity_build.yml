name: Unity Build

on:
  workflow_dispatch:
    inputs:
      StandaloneWindows64:
        description: "Windows64"
        type: boolean
        default: true
      WebGL:
        description: "WebGL"
        type: boolean
        default: false
      Android:
        description: "Android"
        type: boolean
        default: false
      iOS:
        description: "iOS"
        type: boolean
        default: false
      StandaloneOSX:
        description: "MacOS"
        type: boolean
        default: false

jobs:
  # 第一步：准备平台列表
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      selected_platforms: ${{ steps.set-platforms.outputs.platforms }}
    steps:
      - id: set-platforms
        run: |
          PLATFORMS=()
          # 根据 input 判断是否加入数组
          if [ "${{ github.event.inputs.StandaloneWindows64 }}" == "true" ]; then PLATFORMS+=("\"StandaloneWindows64\""); fi
          if [ "${{ github.event.inputs.WebGL }}" == "true" ]; then PLATFORMS+=("\"WebGL\""); fi
          if [ "${{ github.event.inputs.Android }}" == "true" ]; then PLATFORMS+=("\"Android\""); fi
          if [ "${{ github.event.inputs.iOS }}" == "true" ]; then PLATFORMS+=("\"iOS\""); fi
          if [ "${{ github.event.inputs.StandaloneOSX }}" == "true" ]; then PLATFORMS+=("\"StandaloneOSX\""); fi

          # 转换为 JSON 数组格式 [ "StandaloneWindows64", "WebGL" ]
          JSON_ARRAY="[$(echo ${PLATFORMS[@]} | sed 's/ /, /g')]"
          echo "platforms=$JSON_ARRAY" >> $GITHUB_OUTPUT
  #  #也可以用     Python 来处理，避免引号转义的麻烦
  #  prepare_matrix:
  #    runs-on: ubuntu-latest
  #    outputs:
  #      selected_platforms: ${{ steps.set-platforms.outputs.platforms }}
  #    steps:
  #      - id: set-platforms
  #        shell: python # 使用 Python 处理 JSON 最方便，不会有引号转义的烦恼
  #        run: |
  #          import json
  #          import os
  #
  #          # 获取所有 inputs
  #          inputs = json.loads('${{ toJSON(github.event.inputs) }}')
  #
  #          # 过滤出值为 "true" 的 key
  #          selected = [key for key, value in inputs.items() if str(value).lower() == 'true']
  #
  #          # 输出给下一步
  #          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
  #              f.write(f'platforms={json.dumps(selected)}\n')

  buildForAllSupportedPlatforms:
    needs: prepare_matrix
    # 如果用户一个都没勾选，则跳过此 Job
    if: needs.prepare_matrix.outputs.selected_platforms != '[]'

    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    env: ${{ vars.UNITY_PROJECT_PATH || '' }} # 设置UNITY_PROJEC_PATH，甚至可以使用切换多个unity项目，不设置则为仓库根目录
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: ${{ fromJson(needs.prepare_matrix.outputs.selected_platforms) }}
    steps:
      - name: Start Build
        run: echo "Current targetPlatform：${{ matrix.targetPlatform }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # 步骤 A：将 GitHub 添加到 SSH 的已知主机列表中，防止连接时卡在确认提示上
      - name: "Add GitHub to the SSH known hosts file"
        run: |
          mkdir -p -m 0700 /home/runner/.ssh
          curl --silent https://api.github.com/meta | jq --raw-output '"github.com "+.ssh_keys[]' >> /home/runner/.ssh/known_hosts
          chmod 600 /home/runner/.ssh/known_hosts

      # 步骤 B：启动 SSH Agent 并加载你存放在 Secret 中的私钥
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: actions/cache@v3
        # with:
        #   path: Library
        #   key: Library-${{ matrix.targetPlatform }}
        #   restore-keys: Library-
        with:
          path: ${{ empty(env.UNITY_PROJECT_PATH) && 'Library' || format('{0}/Library', env.UNITY_PROJECT_PATH) }}
          key: Library-${{ env.UNITY_PROJECT_PATH }}-${{ matrix.targetPlatform }}
          restore-keys: |
            Library-${{ env.UNITY_PROJECT_PATH }}-

      - if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          # 关键点：将 SSH Agent 的 Socket 传给运行在 Docker 中的 Unity Builder
          sshAgent: ${{ env.SSH_AUTH_SOCK }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ env.UNITY_PROJECT_PATH }}-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 1
